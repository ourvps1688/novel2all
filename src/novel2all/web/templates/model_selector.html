{# V0.30.1 模型选择器 — Alpine.js 管理状态 #}
<div class="card"
     x-data="{ currentModel: '{{ current_model }}' }">
    <h2>🤖 模型选择 <span class="badge" x-text="currentModel"></span></h2>
    <form hx-post="/api/model/switch"
          hx-target="this"
          hx-swap="outerHTML"
          hx-trigger="change from:select"
          hx-on::after-request="currentModel = $event.detail.xhr.response ? JSON.parse($event.detail.xhr.response).new_model : currentModel">
        <label for="model-select" style="display: block; margin-bottom: 8px; font-size: 13px; color: var(--fg-muted);">
            选择模型（V0.27 transparent 分流后，minimax-M3 已可用）
        </label>
        <select id="model-select" name="model"
                style="width: 100%; padding: 8px; font-size: 14px;"
                @change="$event.target.form.requestSubmit()">
            {% for m in models %}
            <option value="{{ m.name }}"
                    {% if m.name == current_model %}selected{% endif %}
                    {% if m.anthropic_compat %}data-anthropic="1"{% endif %}>
                {{ m.name }}{% if m.anthropic_compat %} (Anthropic Messages){% endif %}
            </option>
            {% endfor %}
        </select>
        <p style="margin-top: 8px; font-size: 12px; color: var(--fg-muted);">
            切换后立即生效（lifespan 单例 config.default_model 更新）
        </p>
    </form>
</div>
