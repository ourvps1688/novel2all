{# V0.30.0 skills partial — HTMX 增量更新 #}
{% if skills %}
    <ul style="list-style: none; padding: 0; margin: 0;">
        {% for s in skills %}
        <li style="padding: 8px 0; border-bottom: 1px solid var(--border);">
            <strong>{{ s.name }}</strong>
            {% if s.user_invocable %}<span class="badge model-invocable">user-invocable</span>{% endif %}
            {% if s.model_invocable %}<span class="badge">model-invocable</span>{% endif %}
            <div style="color: var(--fg-muted); font-size: 13px; margin-top: 4px;">{{ s.description }}</div>
        </li>
        {% endfor %}
    </ul>
{% else %}
    <p class="status-warn">未发现 skill（检查 <code>skills/</code> 目录）</p>
{% endif %}
