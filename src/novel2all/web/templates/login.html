{% extends "base.html" %}

{% block title %}登录 - novel2all{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 60px auto;">
    <h2>🔐 登录</h2>
    <p style="color: var(--fg-muted); font-size: 13px; margin: 8px 0 24px;">
        novel2all 多用户版本需要登录。首次使用请设置
        <code>NOVEL2ALL_ADMIN_USER</code> 和 <code>NOVEL2ALL_ADMIN_PASS</code> 环境变量。
    </p>

    <form hx-post="/api/auth/login"
          hx-target="#login-result"
          hx-swap="innerHTML">
        <div style="margin-bottom: 12px;">
            <label for="username" style="display: block; font-size: 13px; margin-bottom: 4px;">
                用户名
            </label>
            <input type="text"
                   id="username"
                   name="username"
                   required
                   minlength="3"
                   autocomplete="username"
                   style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="password" style="display: block; font-size: 13px; margin-bottom: 4px;">
                密码
            </label>
            <input type="password"
                   id="password"
                   name="password"
                   required
                   autocomplete="current-password"
                   style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
        </div>

        <button type="submit"
                class="btn-primary"
                style="width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer;">
            登录
        </button>
    </form>

    <div id="login-result" style="margin-top: 16px;"></div>

    <p style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--fg-muted);">
        V0.30.6 B5: Session cookie (HttpOnly + SameSite=Strict, 7 天) + Rate limit (5 次/5 分钟).
    </p>
</div>
{% endblock %}
