<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976d2" />
    <meta
      name="description"
      content="novel2all — AI 驱动的小说创作平台（V1.5 React SPA）"
    />
    <title>novel2all · 长篇创作</title>
    <!-- 防止 FOUC：注入 dark/light mode class -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('n2a.theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage 不可用 → 默认 light */
        }
      })();
    </script>
    <style>
      /* 首屏 fallback 背景色：避免白闪 */
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family:
          'PingFang SC',
          'Microsoft YaHei',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      html.dark,
      html.dark body {
        background-color: #121212;
      }
      #root {
        min-height: 100vh;
      }
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-size: 14px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">Loading novel2all…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
