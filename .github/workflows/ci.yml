name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.5.0'

jobs:
  # ===== Test 矩阵：多个 Python 版本 + 多个 OS =====
  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        # V0.30.5: 默认跳过 e2e（playwright tests 在专属 e2e job 跑）
        run: uv run pytest tests/ -v --tb=short --color=yes -m "not e2e"

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest tests/ --cov=src/novel2all --cov-report=xml --cov-report=term-missing -m "not e2e"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ===== V0.30.5: Playwright WebUI E2E 测试 =====
  e2e-playwright:
    name: E2E (playwright / ${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # V0.30.5: 安装 chromium 浏览器（依赖系统库，因此 ubuntu 加 --with-deps）
      - name: Install Playwright Chromium (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: uv run playwright install chromium --with-deps

      - name: Install Playwright Chromium (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run playwright install chromium

      - name: Run Playwright E2E tests
        run: uv run pytest tests/e2e/test_web_ui_playwright_v0305.py -v --tb=short --color=yes -m e2e

  # ===== Lint 检查 =====
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  # ===== Type check =====
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Run mypy
        run: uv run mypy src/novel2all --strict --ignore-missing-imports
        continue-on-error: true   # v0.20 类型完整度有限，先 warning 不阻断

  # ===== Skill / Role 注册验证 =====
  manifest:
    name: Skills + Roles manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Verify 13 skills + 7 roles
        run: |
          uv run python -c "
          from pathlib import Path
          from novel2all.core.skill import SkillRegistry
          from novel2all.core.role import RoleRegistry

          skills = SkillRegistry(Path('src/novel2all/skills'))
          skills.discover()
          roles = RoleRegistry(Path('src/novel2all/roles'))
          roles.discover()

          assert len(skills.list()) == 13, f'Expected 13 skills, got {len(skills.list())}'
          assert len(roles.list()) == 7, f'Expected 7 roles, got {len(roles.list())}'
          print(f'OK: {len(skills.list())} skills, {len(roles.list())} roles')
          "

  # ===== License check =====
  license:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify MIT license
        run: |
          test -f LICENSE
          head -1 LICENSE | grep -i 'MIT License'

  # ===== CI 集成测试 =====
  ci-integration:
    name: CI integration scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Test ci_status.py summarize + format_run
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import ci_status

          # Test format_run
          run = {
              'id': 1, 'name': 'CI', 'status': 'completed', 'conclusion': 'success',
              'head_branch': 'main', 'head_sha': 'abc1234',
              'head_commit': {'message': 'test', 'author': {'name': 'X'}},
              'event': 'push', 'created_at': '2026-09-12T09:00:00Z',
              'updated_at': '2026-09-12T09:00:30Z',
              'html_url': 'https://example.com',
          }
          f = ci_status.format_run(run)
          assert f['status'] == 'completed'
          assert f['conclusion_icon'] == '✅'

          # Test summarize
          s = ci_status.summarize([
              {'status': 'completed', 'conclusion': 'success', 'id': 1},
              {'status': 'completed', 'conclusion': 'failure', 'id': 2},
          ])
          assert s['summary']['success'] == 1
          assert s['summary']['failure'] == 1
          assert s['latest_failure']['id'] == 2

          print('ci_status.py logic OK')
          "
      - name: Test scripts import
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import ci_status
          import ci_watch
          import ci_notify
          print('All CI scripts import OK')
          "

  # ===== V0.52 Cache 性能回归检测 =====
  # V0.52.1：GitHub Actions 共享 runner 抖动 ±50%（即使同环境）。
  # benchmark 设为 advisory（continue-on-error）而非 blocking：
  # - 仍跑 benchmark + 输出报告
  # - 失败不阻断 PR
  # - 维护者通过 artifact review 决定是否真有回归
  cache-benchmark:
    name: Cache benchmark regression (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Run cache benchmark + regression check
        # V0.52：跑简化的 cache benchmark + 对比 baseline
        # 退出码：0 = pass / 1 = 检测到回归
        # CI 仍产出 artifact 用于人工 review
        run: uv run python scripts/benchmark_cache_ci.py
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-benchmark-results
          path: scripts/cache_benchmark_ci_results.json
          retention-days: 30
      - name: Print summary if regression detected
        if: failure()
        run: |
          echo "⚠️  Cache benchmark detected regression(s)"
          echo "    See artifact: cache-benchmark-results"
          echo "    Note: GitHub Actions shared runners have ±50% noise."
          echo "    Check if regression is consistent across multiple runs."

  # ===== Build sdist + wheel =====
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, lint, manifest, e2e-playwright]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Build sdist + wheel
        run: uv run python -m build
      - name: Check dist
        run: uv run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
