name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # PyPI trusted publishing（如果已配置）
  packages: write  # GHCR push
  attestations: write  # SBOM attestation (V1.0 GA)

jobs:
  # ===== 阶段 1：PyPI 包发布（可选，需配置 trusted publishing） =====
  pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    continue-on-error: true  # PyPI 没配置时跳过（不影响 Docker + GitHub Release）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.0'

      - name: Install build tools
        run: uv pip install --system build twine

      - name: Generate changelog
        run: |
          python scripts/generate_changelog.py "${{ github.ref_name }}" CHANGELOG_AUTO.md
          cat CHANGELOG_AUTO.md

      - name: Build sdist + wheel
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Publish to PyPI
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ===== 阶段 2：Docker multi-arch image =====
  docker:
    name: Build & Push Docker (multi-arch)
    runs-on: ubuntu-latest
    needs: pypi
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push (platform=${{ matrix.platform }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: true
          sbom: true

      - name: Create manifest (multi-arch aggregate)
        if: matrix.arch == 'amd64'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${VERSION} \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${VERSION}-amd64 \
            ghcr.io/${{ github.repository }}:${VERSION}-arm64

  # ===== 阶段 3：GitHub Release =====
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          python scripts/generate_changelog.py "${{ github.ref_name }}" /tmp/CHANGELOG.md
          cat /tmp/CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
