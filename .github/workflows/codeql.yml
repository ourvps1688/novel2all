name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # 每周一跑

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # 注意：本私有仓库当前未在 Settings → Code security 启用 code scanning
    # （security_and_analysis 无 code_scanning 项，依赖账号计划/Advanced Security），
    # 故 CodeQL analyze 会报 configuration error。设为不阻断整体流水线，
    # 待仓库开启 CodeQL 后将自动转绿。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
